spring.application.name=idorendmaker-backend
spring.profiles.active=dev
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.banner.location=classpath:banner.txt
spring.jmx.enabled=false

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.jackson.deserialization.read-date-timestamps-as-nanoseconds=false

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Catalog update (placeholder until first GitHub release is published)
app.catalog.manifest-url=
app.catalog.expected-schema-version=1

# Logging defaults (dev/prod override below)
logging.level.hu.szabolcst.idorendmaker=INFO
logging.level.org.hibernate.SQL=WARN
