app.database.mode=development
# Deprecated: kept for backward compatibility, Phase 9 will remove it.
app.database.development.relative-path=../../idorendmaker-desktop/idorendmaker.db
app.database.development.relative-dir=../../idorendmaker-desktop

# Phase 1: user.db starts empty, so the legacy SQL migrations (which assume a
# pre-existing schema) would fail. Disable them in dev until Phase 2 introduces
# Liquibase changesets that create the schema on a fresh user.db, and Phase 8
# removes the custom MigrationRunner entirely.
app.migration.enabled=false

logging.level.hu.szabolcst.idorendmaker=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true
